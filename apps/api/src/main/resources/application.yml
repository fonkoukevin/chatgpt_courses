spring:
  application:
    name: chatgpt-courses-api
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.debug: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?connectTimeout=2&socketTimeout=3
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 2500
      validation-timeout: 1000
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'UTC'
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    log-resolved-exception: false
    log-request-details: false
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
server:
  forward-headers-strategy: none
  address: 127.0.0.1
  port: ${API_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE}
        same-site: lax
        path: /
courses:
  identity:
    reset-token-ttl: 30m
    reset-window: 15m
    reset-request-limit: 3
  notifications:
    mail-mode: ${MAIL_MODE:local}
    mail-from: ${MAIL_FROM:}
    outbox:
      encryption-key: ${NOTIFICATION_OUTBOX_KEY:}
      worker-enabled: ${NOTIFICATION_OUTBOX_ENABLED:true}
      poll-delay: ${NOTIFICATION_OUTBOX_POLL_DELAY:1s}
      lease-duration: ${NOTIFICATION_OUTBOX_LEASE_DURATION:30s}
      max-attempts: ${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:5}
      retry-base: ${NOTIFICATION_OUTBOX_RETRY_BASE:5s}
      retry-max: ${NOTIFICATION_OUTBOX_RETRY_MAX:5m}
      payload-retention: ${NOTIFICATION_OUTBOX_PAYLOAD_RETENTION:24h}
  assets:
    enabled: ${STORAGE_ENABLED:false}
    internal-endpoint: ${S3_ENDPOINT:}
    external-endpoint: ${S3_EXTERNAL_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    editorial-bucket: ${S3_PUBLIC_BUCKET:}
    private-bucket: ${S3_PRIVATE_BUCKET:}
    path-style: ${S3_PATH_STYLE:true}
    max-file-bytes: ${ASSET_MAX_FILE_BYTES:5242880}
    max-image-bytes: ${ASSET_MAX_IMAGE_BYTES:10485760}
    max-files-per-project: ${ASSET_MAX_FILES_PER_PROJECT:10}
    max-bytes-per-project: ${ASSET_MAX_BYTES_PER_PROJECT:20971520}
    upload-ttl-seconds: ${ASSET_UPLOAD_TTL_SECONDS:300}
    download-ttl-seconds: ${ASSET_DOWNLOAD_TTL_SECONDS:60}
    max-image-pixels: ${ASSET_MAX_IMAGE_PIXELS:16000000}
    max-image-dimension: ${ASSET_MAX_IMAGE_DIMENSION:4096}
    staging-cleanup-grace-seconds: ${ASSET_STAGING_CLEANUP_GRACE_SECONDS:60}
    staging-cleanup-worker-enabled: ${ASSET_STAGING_CLEANUP_WORKER_ENABLED:true}
    staging-cleanup-poll-delay: ${ASSET_STAGING_CLEANUP_POLL_DELAY:60s}
  media:
    enabled: ${VIDEO_ENABLED:false}
    provider: ${VIDEO_PROVIDER:}
    local-root: ${VIDEO_LOCAL_ROOT:}
    link-ttl-seconds: ${VIDEO_LINK_TTL_SECONDS:60}
    max-video-bytes: ${VIDEO_MAX_BYTES:20971520}
  runtime:
    environment: ${APP_ENV}
    public-origin: ${APP_PUBLIC_ORIGIN}
    session-cookie-secure: ${SESSION_COOKIE_SECURE}
logging:
  level:
    org.springframework.web: WARN
    org.springframework.security: WARN
