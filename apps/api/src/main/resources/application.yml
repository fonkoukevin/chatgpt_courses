spring:
  application:
    name: chatgpt-courses-api
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
      mail.debug: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?connectTimeout=2&socketTimeout=3
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 2500
      validation-timeout: 1000
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    log-resolved-exception: false
    log-request-details: false
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
server:
  forward-headers-strategy: none
  address: 127.0.0.1
  port: ${API_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE}
        same-site: lax
        path: /
courses:
  identity:
    reset-token-ttl: 30m
    reset-window: 15m
    reset-request-limit: 3
  notifications:
    mail-mode: ${MAIL_MODE:local}
    mail-from: ${MAIL_FROM:}
  runtime:
    environment: ${APP_ENV}
    public-origin: ${APP_PUBLIC_ORIGIN}
    session-cookie-secure: ${SESSION_COOKIE_SECURE}
logging:
  level:
    org.springframework.web: WARN
    org.springframework.security: WARN
