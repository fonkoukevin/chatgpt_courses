              maximum: 1440
            - type: 'null'
        children:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumNode'
          maxItems: 100
      description: >-
        versionId est exactement la child_version_id enregistrée dans la composition du parent. Ne jamais la
        remplacer par la dernière version globale de la ressource enfant. Les informations non publiées ne
        sont pas exposées.
    ResourceDetail:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - kind
        - versionId
        - versionNumber
        - locale
        - slug
        - availability
        - revisionId
        - title
        - summary
        - access
        - document
        - metadata
        - reviewedAt
        - languages
        - curriculum
        - related
        - objective
        - expectedResult
        - prerequisites
        - estimatedMinutes
      properties:
        resourceId:
          $ref: '#/components/schemas/UUID'
        kind:
          $ref: '#/components/schemas/ContentKind'
        versionId:
          $ref: '#/components/schemas/UUID'
        versionNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 180
            - type: 'null'
        availability:
          type: string
          enum:
            - PUBLISHED
            - MISSING_TRANSLATION
            - STALE
            - WITHDRAWN
        revisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        title:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 240
            - type: 'null'
        summary:
          anyOf:
            - type: string
              minLength: 0
              maxLength: 2000
            - type: 'null'
        access:
          anyOf:
            - $ref: '#/components/schemas/ContentAccess'
            - type: 'null'
        document:
          anyOf:
            - $ref: '#/components/schemas/PublicDocument'
            - type: 'null'
        metadata:
          $ref: '#/components/schemas/PublicMetadata'
        reviewedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageAvailability'
          maxItems: 2
        curriculum:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumNode'
          maxItems: 100
        related:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCard'
          maxItems: 30
        objective:
          anyOf:
            - type: string
              minLength: 0
              maxLength: 4000
            - type: 'null'
        expectedResult:
          anyOf:
            - type: string
              minLength: 0
              maxLength: 4000
            - type: 'null'
        prerequisites:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          maxItems: 20
        estimatedMinutes:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 1440
            - type: 'null'
      description: >-
        Tout provient de révisions réellement publiées. Document uniquement pour FREE+PUBLISHED, sans corrigés
        ni réponses ; PROTECTED n’expose que les champs descriptifs publics.
        MISSING_TRANSLATION/STALE/WITHDRAWN conservent le contexte d’identité/version et les équivalents, sans
        document ni métadonnées empruntés. reviewedAt est la revue de la publication, pas d’un prochain
        brouillon. Aucun auteur privé, droit personnel, prix ni fausse offre.
    MethodParameters:
      type: object
      additionalProperties: false
      required:
        - objective
        - context
        - availableData
        - recipient
        - format
        - constraints
        - clarifications
      properties:
        objective:
          type: string
          minLength: 0
          maxLength: 4000
        context:
          type: string
          minLength: 0
          maxLength: 4000
        availableData:
          type: string
          minLength: 0
          maxLength: 4000
        recipient:
          type: string
          minLength: 0
          maxLength: 4000
        format:
          type: string
          minLength: 0
          maxLength: 4000
        constraints:
          type: string
          minLength: 0
          maxLength: 4000
        clarifications:
          type: string
          minLength: 0
          maxLength: 4000
      description: >-
        Champs structurés indépendants du texte final. Objectif, données disponibles et format sont requis
        pour assembler localement une instruction ; aucun appel IA.
    MethodDefinition:
      type: object
      additionalProperties: false
      required:
        - useCases
        - requiredInputs
        - steps
        - starterInstruction
        - example
        - checks
        - limitations
        - defaults
      properties:
        useCases:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        requiredInputs:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        steps:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        starterInstruction:
          type: string
          minLength: 0
          maxLength: 4000
        example:
          type: string
          minLength: 0
          maxLength: 8000
        checks:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        limitations:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        defaults:
          $ref: '#/components/schemas/MethodParameters'
      description: >-
        Définition localisée dans la révision éditoriale immuable, limitée à24KiB UTF8. Les listes/chaînes
        peuvent rester vides en brouillon ; une nouvelle publication METHOD_TEMPLATE exige leur complétude.
        Aucun contenu premium n’est révélé par cette définition.
    MethodFields:
      type: object
      additionalProperties: false
      required:
        - title
        - locale
        - text
        - parameters
        - generatedFrom
        - notes
        - category
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        locale:
          $ref: '#/components/schemas/Locale'
        text:
          type: string
          minLength: 1
          maxLength: 32000
        parameters:
          $ref: '#/components/schemas/MethodParameters'
        generatedFrom:
          anyOf:
            - $ref: '#/components/schemas/MethodParameters'
            - type: 'null'
        notes:
          type: string
          minLength: 0
          maxLength: 8000
        category:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
      description: >-
        Instantané utilisateur complet, au plus48KiB de JSON UTF8 (generatedFrom inclus). PATCH remplace
        explicitement ces champs. Texte, notes et langue restent indépendants de la source et de la langue
        d’interface. Chaînes Unicode valides, sans NUL ; titre/texte/catégorie non blancs. Aucun ownerId,
        rôle, origine ou révision autoritaire en entrée.
    CreateMethod:
      type: object
      additionalProperties: false
      required:
        - fields
      properties:
        fields:
          $ref: '#/components/schemas/MethodFields'
    UpdateMethod:
      type: object
      additionalProperties: false
      required:
        - fields
      properties:
        fields:
          $ref: '#/components/schemas/MethodFields'
    MethodFromTemplate:
      type: object
      additionalProperties: false
      required:
        - sourceResourceId
        - sourceVersionId
        - sourceRevisionId
        - sourceLocale
        - fields
      properties:
        sourceResourceId:
          $ref: '#/components/schemas/UUID'
        sourceVersionId:
          $ref: '#/components/schemas/UUID'
        sourceRevisionId:
          $ref: '#/components/schemas/UUID'
        sourceLocale:
          $ref: '#/components/schemas/Locale'
        fields:
          $ref: '#/components/schemas/MethodFields'
      description: >-
        Le serveur vérifie le snapshot METHOD_TEMPLATE exact, publié, FREE et défini. Une autre révision
        publiée depuis la consultation retourne412, sans substitution silencieuse. Le client ne choisit ni
        propriétaire ni traduction d’origine.
    MethodOrigin:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - versionId
        - translationId
        - revisionId
        - locale
        - title
        - slug
      properties:
        resourceId:
          $ref: '#/components/schemas/UUID'
        versionId:
          $ref: '#/components/schemas/UUID'
        translationId:
          $ref: '#/components/schemas/UUID'
        revisionId:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        title:
          type: string
          minLength: 1
          maxLength: 240
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      description: >-
        Origine capturée côté serveur et immuable ; aucun remplacement du texte personnel par une source
        ultérieure.
    MethodView:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - title
        - locale
        - text
        - parameters
        - generatedFrom
        - notes
        - category
        - origin
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        revision:
          $ref: '#/components/schemas/Revision'
        title:
          type: string
          minLength: 1
          maxLength: 240
        locale:
          $ref: '#/components/schemas/Locale'
        text:
          type: string
          minLength: 1
          maxLength: 32000
        parameters:
          $ref: '#/components/schemas/MethodParameters'
        generatedFrom:
          anyOf:
            - $ref: '#/components/schemas/MethodParameters'
            - type: 'null'
        notes:
          type: string
          minLength: 0
          maxLength: 8000
        category:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        origin:
          anyOf:
            - $ref: '#/components/schemas/MethodOrigin'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/UtcInstant'
        updatedAt:
          $ref: '#/components/schemas/UtcInstant'
      description: >-
        Détail privé du propriétaire, sans état dynamique de source afin que son ETag fort couvre exactement
        cette représentation.
    MethodSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - title
        - locale
        - category
        - updatedAt
        - hasSource
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        revision:
          $ref: '#/components/schemas/Revision'
        title:
          type: string
          minLength: 1
          maxLength: 240
        locale:
          $ref: '#/components/schemas/Locale'
        category:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 80
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/UtcInstant'
        hasSource:
          type: boolean
    MethodPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MethodSummary'
        page:
          type: integer
          minimum: 0
          maximum: 1000000
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    MethodSourceUpdate:
      type: object
      additionalProperties: false
      required:
        - status
        - source
        - candidate
      properties:
        status:
          type: string
          enum:
            - NONE
            - CURRENT
            - UPDATE_AVAILABLE
            - UNAVAILABLE
        source:
          anyOf:
            - $ref: '#/components/schemas/MethodOrigin'
            - type: 'null'
        candidate:
          anyOf:
            - $ref: '#/components/schemas/MethodOrigin'
            - type: 'null'
      description: >-
        Lecture séparée sans ETag de méthode personnelle. Candidate seulement si publication actuelle
        autorisée dans la langue source ; une source retirée, protégée, absente ou non définie reste
        indisponible. Aucune synchronisation automatique.
    MethodTemplate:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - versionId
        - revisionId
        - locale
        - title
        - slug
        - availability
        - definition
      properties:
        resourceId:
          $ref: '#/components/schemas/UUID'
        versionId:
          $ref: '#/components/schemas/UUID'
        revisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        locale:
          $ref: '#/components/schemas/Locale'
        title:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 240
            - type: 'null'
        slug:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 180
            - type: 'null'
        availability:
          type: string
          enum:
            - PUBLISHED
            - MISSING_DEFINITION
            - PROTECTED
            - STALE
            - WITHDRAWN
            - MISSING_TRANSLATION
        definition:
          anyOf:
            - $ref: '#/components/schemas/MethodDefinition'
            - type: 'null'
      description: >-
        Version exacte, jamais latest implicite. Définition présente uniquement pour une publication FREE
        complète. Les articles historiques sans définition conservent MISSING_DEFINITION, sans générateur
        inventé.
  headers:
    NoStore:
      description: Réponse non stockable ; les erreurs sont également privées.
      schema:
        type: string
        enum:
          - no-store
          - private, no-store
    ETag:
      description: >-
        ETag fort reçu du serveur. Préférences : preferences-{uuid}-r{revision} ; document CMS :
        content-{translationUuid}-r{revision}. Les représentations distinctes doivent invalider leur tag
        lorsque leurs octets changent.
      schema:
        type: string
        pattern: ^"[^"\\]*"$
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Reprendre l’ETag fort reçu, sans le reconstruire. Absent ou * seul : 428 ; révision dépassée ou tag
        faible : 412 ; syntaxe invalide : 400. Comparaison et écriture atomiques dans le service ; aucune
        répétition écrasante automatique.
      schema:
        type: string
        minLength: 1
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Jeton fourni par GET /auth/csrf pour cette session. Renouveler après login/logout ou expiration ;
        conserver en mémoire seulement.
      schema:
        type: string
        minLength: 1
    AccountContext:
      name: X-Account-Context
      in: header
      required: true
      description: >-
        UUID du compte que l’interface attend lors de cette action explicite. Comparé à la session côté
        serveur, jamais utilisé comme propriétaire. Absent428 ACCOUNT_CONTEXT_REQUIRED ; compte différent409
        ACCOUNT_CONTEXT_CHANGED ; syntaxe invalide400 VALIDATION_FAILED. Renouveler le contexte après
        changement de compte ; aucun import automatique du brouillon précédent.
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    ProblemResponse:
      description: Erreur explicite ; aucune donnée de remplacement.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceProblem:
      description: Service, base de données ou connexion au relais indisponible.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de session Spring opaque HttpOnly ; Secure en HTTPS, SameSite=Lax, Path=/.
