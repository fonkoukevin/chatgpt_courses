            - type: 'null'
        fields:
          $ref: '#/components/schemas/ProjectFields'
        stage:
          type: string
          enum:
            - DRAFT
            - READY_FOR_SELF_ASSESSMENT
      description: >-
        Création idempotente par propriétaire + creationId et empreinte du corps : même corps retrouve le
        projet(200), autre corps409. Source publiéeFREE exacte requise pour une nouvelle création. Inscription
        facultative vérifiée côté serveur ; aucun propriétaire ou score admis dans le JSON.
    SaveProject:
      type: object
      additionalProperties: false
      required:
        - fields
        - stage
      properties:
        fields:
          $ref: '#/components/schemas/ProjectFields'
        stage:
          type: string
          enum:
            - DRAFT
            - READY_FOR_SELF_ASSESSMENT
      description: >-
        Nouvelle révision append-only sous verrou propriétaire et If-Match. READY exige du texte non blanc
        dans les sections ou externalText ; cette condition ne vérifie pas sa qualité.
    SubmitSelfAssessment:
      type: object
      additionalProperties: false
      required:
        - submissionId
        - projectRevisionId
        - rubricVersionId
        - answers
        - blockingDeclarations
        - comment
      properties:
        submissionId:
          $ref: '#/components/schemas/UUID'
        projectRevisionId:
          $ref: '#/components/schemas/UUID'
        rubricVersionId:
          $ref: '#/components/schemas/UUID'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/CriterionDeclaration'
          minItems: 20
          maxItems: 20
        blockingDeclarations:
          type: array
          items:
            $ref: '#/components/schemas/BlockingDeclaration'
          minItems: 4
          maxItems: 4
        comment:
          type: string
          minLength: 0
          maxLength: 4000
      description: >-
        Vingt contrôles et quatre déclarations exacts, uniques et complets. Score fourni par Spring seulement
        ; corps JSONUTF8 borné48KiB. Même propriétaire/submissionId/corps retrouve la preuve avant If-Match
        pour une réponse déjà committée ; autre corps409. Jamais de retry automatique.
    RevealSolution:
      type: object
      additionalProperties: false
      required:
        - projectId
        - projectRevisionId
        - activityVersionId
        - revisionId
        - locale
      properties:
        projectId:
          $ref: '#/components/schemas/UUID'
        projectRevisionId:
          $ref: '#/components/schemas/UUID'
        activityVersionId:
          $ref: '#/components/schemas/UUID'
        revisionId:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
      description: >-
        Origine exacte du projet. AFTER_SUBMISSION exige une autoévaluation déjà enregistrée pour cette
        révision personnelle, sans condition de score. EXPLICIT exige seulement l’action volontaire.
        Retrait/PROTECTED refuse aussi le rejeu d’une consultation antérieure.
    ProjectPreset:
      type: object
      additionalProperties: false
      required:
        - caseCode
        - locale
        - policy
        - rubric
