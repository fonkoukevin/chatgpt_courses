        stade, score ou progression.
    CreateProject:
      type: object
      additionalProperties: false
      required:
        - creationId
        - activityId
        - activityVersionId
        - revisionId
        - sourceLocale
        - enrollmentId
        - fields
        - stage
      properties:
        creationId:
          $ref: '#/components/schemas/UUID'
        activityId:
          $ref: '#/components/schemas/UUID'
        activityVersionId:
          $ref: '#/components/schemas/UUID'
        revisionId:
          $ref: '#/components/schemas/UUID'
        sourceLocale:
          $ref: '#/components/schemas/Locale'
        enrollmentId:
