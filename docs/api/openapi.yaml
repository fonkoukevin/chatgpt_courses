components:
  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: UP
    UUID:
      type: string
      format: uuid
      description: Identifiant technique ; ne constitue jamais une autorisation.
    Locale:
      type: string
      enum:
        - fr
        - en
      description: Langue explicite, indépendante de l'identité pédagogique.
    UtcInstant:
      type: string
      format: date-time
      pattern: Z$
      description: Instant ISO 8601 en UTC, avec suffixe Z.
    Revision:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Révision optimiste exacte dans les entiers sûrs JavaScript.
    Money:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - currency
      description: >-
        Montant exact en unités mineures et devise explicite. Ce schéma ne définit aucun prix ni aucune devise
        commerciale autorisée.
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Code de devise ISO 4217 ; configuration de vente requise.
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          description: Chemin du champ concerné, sans valeur rejetée.
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Code stable permettant la traduction du message.
        message:
          type: string
          minLength: 1
          description: Message sûr ; jamais une valeur privée ou une exception brute.
    Problem:
      type: object
      description: >-
        RFC 9457. Les codes stables pilotent les traductions. Ni trace technique, secret, valeur de champ
        rejetée ou donnée privée dans les messages. fieldErrors n'est présent que lorsqu'une validation le
        nécessite.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri
          const: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
          description: Chemin de requête, sans paramètres privés.
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: >-
            Notamment RESOURCE_NOT_FOUND, SERVICE_UNAVAILABLE, INTERNAL_ERROR, API_UNAVAILABLE,
            API_CONFIGURATION_ERROR, API_INVALID_RESPONSE, INVALID_API_PATH, INVALID_REQUEST,
            VALIDATION_FAILED, INVALID_IF_MATCH, CONFLICT, REVISION_CONFLICT, PRECONDITION_REQUIRED. Cette
            liste reste ouverte aux erreurs des lots suivants.
        traceId:
          $ref: '#/components/schemas/UUID'
        fieldErrors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldError'
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - locale
        - roles
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
        locale:
          $ref: '#/components/schemas/Locale'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - token
        - headerName
        - parameterName
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
        parameterName:
          type: string
          const: _csrf
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - locale
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12 à 128 points Unicode, au plus 1024 octets UTF-8. Aucun retrait ou troncature du mot de passe.
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
        locale:
          $ref: '#/components/schemas/Locale'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - locale
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        locale:
          $ref: '#/components/schemas/Locale'
    PasswordReset:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Jeton opaque reçu par email, jamais dans une query string.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12 à 128 points Unicode, au plus 1024 octets UTF-8. Aucun retrait ou troncature du mot de passe.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - revision
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        revision:
          $ref: '#/components/schemas/Revision'
    PreferencesPatch:
      type: object
      additionalProperties: false
      required:
        - locale
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
    ContentKind:
      type: string
      enum:
        - COURSE
        - MODULE
        - ACTIVITY
        - GUIDE
        - METHOD_TEMPLATE
    EditorialState:
      type: string
      enum:
        - DRAFT
        - TO_REVIEW
        - READY
        - PUBLISHED
        - STALE
        - ARCHIVED
    ContentAccess:
      type: string
      enum:
        - FREE
        - PROTECTED
    ContentBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - text
        - url
      properties:
        type:
          type: string
          enum:
            - HEADING
            - PARAGRAPH
            - LIST
            - CALLOUT
            - CODE
            - LINK
        text:
          type: string
          minLength: 1
          maxLength: 4000
        url:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: 'null'
      description: >-
        Texte brut, jamais HTML/MDX. LINK exige une URL HTTPS sans credentials ou un chemin interne simple ;
        les autres types exigent url:null. Pas de téléchargement serveur depuis cette URL.
    Exercise:
      type: object
      additionalProperties: false
      required:
        - instructions
        - correction
      properties:
        instructions:
          type: string
          minLength: 0
          maxLength: 8000
        correction:
          type: string
          minLength: 0
          maxLength: 8000
    QuizQuestion:
      type: object
      additionalProperties: false
      required:
        - key
        - prompt
        - options
        - correctOption
        - explanation
        - points
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        options:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          minItems: 2
          maxItems: 8
        correctOption:
          type: integer
          minimum: 0
          maximum: 7
        explanation:
          type: string
          minLength: 1
          maxLength: 4000
        points:
          type: integer
          minimum: 1
          maximum: 1000
      description: >-
        correctOption est un index 0-based strictement inférieur au nombre d’options ; clé unique dans le
        document. Réponses réservées aux routes administratives.
    RubricCriterion:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - points
        - blocking
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        label:
          type: string
          minLength: 1
          maxLength: 2000
        points:
          type: integer
          minimum: 1
          maximum: 1000
        blocking:
          type: boolean
    MediaReference:
      type: object
      additionalProperties: false
      required:
        - assetId
        - kind
        - required
        - label
      properties:
        assetId:
          $ref: '#/components/schemas/UUID'
        kind:
          type: string
          enum:
            - IMAGE
            - VIDEO
            - FILE
        required:
          type: boolean
        label:
          type: string
          minLength: 1
          maxLength: 240
      description: >-
        Aucun état de disponibilité choisi par le client. Les références sont non vérifiées en P05 ; required
        bloque tant que le registre serveur P10 ne les valide pas.
    ContentDocument:
      type: object
      additionalProperties: false
      required:
        - objective
        - expectedResult
        - prerequisites
        - blocks
        - estimatedMinutes
        - exercise
        - quiz
        - rubric
        - access
        - media
        - relatedResourceIds
      properties:
        objective:
          type: string
          minLength: 0
          maxLength: 4000
        expectedResult:
          type: string
          minLength: 0
          maxLength: 4000
        prerequisites:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          minItems: 0
          maxItems: 20
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
          minItems: 0
          maxItems: 60
        estimatedMinutes:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 1440
            - type: 'null'
        exercise:
          anyOf:
            - $ref: '#/components/schemas/Exercise'
            - type: 'null'
        quiz:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
          minItems: 0
          maxItems: 20
        rubric:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriterion'
          minItems: 0
          maxItems: 30
        access:
          $ref: '#/components/schemas/ContentAccess'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaReference'
          minItems: 0
          maxItems: 20
        relatedResourceIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 30
          uniqueItems: true
      description: >-
        Document structuré privé ; taille sérialisée totale maximale 48 KiB UTF-8. La requête entière reste
        limitée à 64 KiB par le relais. Listes bornées et références contrôlées dans le service.
    CreateContent:
      type: object
      additionalProperties: false
      required:
        - kind
        - locale
        - slug
        - title
        - summary
        - objectives
        - evaluationDefinition
        - document
        - childVersionIds
        - reason
      properties:
        kind:
          $ref: '#/components/schemas/ContentKind'
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        objectives:
          type: string
          minLength: 1
          maxLength: 4000
        evaluationDefinition:
          type: string
          minLength: 1
          maxLength: 4000
        document:
          $ref: '#/components/schemas/ContentDocument'
        childVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    SaveRevision:
      type: object
      additionalProperties: false
      required:
        - title
        - summary
        - document
        - reason
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        document:
          $ref: '#/components/schemas/ContentDocument'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      description: >-
        Ajoute un instantané éditorial sans changer la version pédagogique. Objectif ou barème changé après
        gel : nouvelle version exigée (409 NEW_PEDAGOGICAL_VERSION_REQUIRED).
    NewVersion:
      type: object
      additionalProperties: false
      required:
        - objectives
        - evaluationDefinition
        - title
        - summary
        - document
        - childVersionIds
        - reason
      properties:
        objectives:
          type: string
          minLength: 1
          maxLength: 4000
        evaluationDefinition:
          type: string
          minLength: 1
          maxLength: 4000
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        document:
          $ref: '#/components/schemas/ContentDocument'
        childVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    DuplicateContent:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - reason
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 240
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    CreateTranslation:
      type: object
      additionalProperties: false
      required:
        - locale
        - slug
        - title
        - summary
        - document
        - reason
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        document:
          $ref: '#/components/schemas/ContentDocument'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    TransitionContent:
      type: object
      additionalProperties: false
      required:
        - state
        - reason
      properties:
        state:
          type: string
          enum:
            - TO_REVIEW
            - READY
            - STALE
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        sourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
      description: >-
        READY exige content.review et readiness sans bloqueur ; TO_REVIEW/STALE exigent content.write. Pour la
        revue d’une traduction liée, sourceRevisionId doit correspondre à la révision source courante.
    PublishContent:
      type: object
      additionalProperties: false
      required:
        - revisionId
        - reason
      properties:
        revisionId:
          $ref: '#/components/schemas/UUID'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      description: >-
        Publie la révision courante déterminée ; readiness, revue, permission et If-Match revérifiés dans la
        transaction.
    ArchiveContent:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ReplaceComposition:
      type: object
      additionalProperties: false
      required:
        - childVersionIds
        - reason
      properties:
        childVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      description: >-
        Ordre complet des UUID versions enfants, position serveur 1-based. Modification réservée à une
        pédagogie non gelée.
    TranslationLink:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - state
        - sourceRevisionId
        - reviewedSourceRevisionId
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        state:
          $ref: '#/components/schemas/EditorialState'
        sourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        reviewedSourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
    ContentView:
      type: object
      additionalProperties: false
      required:
        - id
        - resourceId
        - kind
        - versionId
        - versionNumber
        - locale
        - slug
        - state
        - revision
        - currentRevisionId
        - publishedRevisionId
        - title
        - summary
        - objectives
        - evaluationDefinition
        - document
        - childVersionIds
        - sourceTranslationId
        - sourceRevisionId
        - reviewedSourceRevisionId
        - verifiedAt
        - updatedAt
        - frozenAt
        - translations
        - legacyBody
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        resourceId:
          $ref: '#/components/schemas/UUID'
        kind:
          $ref: '#/components/schemas/ContentKind'
        versionId:
          $ref: '#/components/schemas/UUID'
        versionNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        state:
          $ref: '#/components/schemas/EditorialState'
        revision:
          $ref: '#/components/schemas/Revision'
        currentRevisionId:
          $ref: '#/components/schemas/UUID'
        publishedRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        objectives:
          type: string
          minLength: 1
          maxLength: 4000
        evaluationDefinition:
          type: string
          minLength: 1
          maxLength: 4000
        document:
          anyOf:
            - $ref: '#/components/schemas/ContentDocument'
            - type: 'null'
        childVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        sourceTranslationId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        sourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        reviewedSourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        verifiedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/UtcInstant'
        frozenAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/TranslationLink'
          minItems: 0
          maxItems: 2
        legacyBody:
          anyOf:
            - type: string
            - type: 'null'
      description: >-
        Représentation administrative complète ; id désigne la traduction/version, resourceId l’identité
        pédagogique stable. ETag fort content-{id}-r{revision}. Ancienne donnée P03 : document:null lisible,
        publication bloquée par STRUCTURED_DOCUMENT_REQUIRED avant une révision structurée explicite.
    ContentSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - resourceId
        - kind
        - versionId
        - versionNumber
        - locale
        - slug
        - state
        - revision
        - title
        - summary
        - verifiedAt
        - updatedAt
        - needsUpdate
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        resourceId:
          $ref: '#/components/schemas/UUID'
        kind:
          $ref: '#/components/schemas/ContentKind'
        versionId:
          $ref: '#/components/schemas/UUID'
        versionNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        state:
          $ref: '#/components/schemas/EditorialState'
        revision:
          $ref: '#/components/schemas/Revision'
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        verifiedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/UtcInstant'
        needsUpdate:
          type: boolean
    RevisionView:
      type: object
      additionalProperties: false
      required:
        - id
        - revisionNumber
        - title
        - summary
        - document
        - authorId
        - createdAt
        - reason
        - replacesRevisionId
        - legacyBody
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        revisionNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        document:
          anyOf:
            - $ref: '#/components/schemas/ContentDocument'
            - type: 'null'
        authorId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/UtcInstant'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        replacesRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        legacyBody:
          anyOf:
            - type: string
            - type: 'null'
      description: >-
        Instantané historique append-only et motif enregistré, sans réécriture des versions ou preuves
        antérieures. Ancien instantané P03 sans document structuré : document:null.
    ContentPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentSummary'
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 0
          maximum: 1000000
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    RevisionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RevisionView'
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 0
          maximum: 1000000
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    ContentIssue:
      type: object
      additionalProperties: false
      required:
        - code
        - field
        - resourceId
        - action
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Z][A-Z0-9_]*$
        field:
          type: string
          minLength: 1
          maxLength: 200
        resourceId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        action:
          type: string
          minLength: 1
          maxLength: 1000
    Readiness:
      type: object
      additionalProperties: false
      required:
        - ready
        - blockingIssues
        - warnings
        - checkedRevision
      properties:
        ready:
          type: boolean
        blockingIssues:
          type: array
          items:
            $ref: '#/components/schemas/ContentIssue'
          minItems: 0
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ContentIssue'
          minItems: 0
        checkedRevision:
          $ref: '#/components/schemas/UUID'
      description: >-
        Contrôle de la révision éditoriale courante, pas autorisation permanente de publier. Le serveur
        recontrôle lors de la transition et de la publication.
    ContentDependency:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - versionId
        - kind
        - title
        - relation
      properties:
        resourceId:
          $ref: '#/components/schemas/UUID'
        versionId:
          $ref: '#/components/schemas/UUID'
        kind:
          $ref: '#/components/schemas/ContentKind'
        title:
          type: string
          minLength: 1
          maxLength: 240
        relation:
          type: string
          enum:
            - COMPOSITION
            - REFERENCE
            - TRANSLATION
    Dependencies:
      type: object
      additionalProperties: false
      required:
        - items
        - canArchive
        - consequences
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentDependency'
          minItems: 0
        canArchive:
          type: boolean
        consequences:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          minItems: 0
    PublicQuizQuestion:
      type: object
      additionalProperties: false
      required:
        - key
        - prompt
        - options
        - points
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        options:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          minItems: 2
          maxItems: 8
        points:
          type: integer
          minimum: 1
          maximum: 1000
      description: >-
        Questions publiques sans correctOption ni explanation ; la correction sera autorisée par le service
        consommateur.
    PublicDocument:
      type: object
      additionalProperties: false
      required:
        - objective
        - expectedResult
        - prerequisites
        - blocks
        - estimatedMinutes
        - quiz
        - rubric
        - access
        - media
        - relatedResourceIds
        - exerciseInstructions
      properties:
        objective:
          type: string
          minLength: 0
          maxLength: 4000
        expectedResult:
          type: string
          minLength: 0
          maxLength: 4000
        prerequisites:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          minItems: 0
          maxItems: 20
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
          minItems: 0
          maxItems: 60
        estimatedMinutes:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 1440
            - type: 'null'
        quiz:
          type: array
          items:
            $ref: '#/components/schemas/PublicQuizQuestion'
          minItems: 0
          maxItems: 20
        rubric:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriterion'
          minItems: 0
          maxItems: 30
        access:
          $ref: '#/components/schemas/ContentAccess'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaReference'
          minItems: 0
          maxItems: 20
        relatedResourceIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 30
          uniqueItems: true
        exerciseInstructions:
          anyOf:
            - type: string
              minLength: 0
              maxLength: 8000
            - type: 'null'
      description: >-
        Projection gratuite publiée, sans corrigé d’exercice ni réponse/explication de quiz. Les contrôles
        d’accès du futur apprentissage restent distincts.
    PublicContent:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - kind
        - versionId
        - versionNumber
        - locale
        - slug
        - availability
        - revisionId
        - title
        - summary
        - access
        - document
        - childResourceIds
      properties:
        resourceId:
          $ref: '#/components/schemas/UUID'
        kind:
          $ref: '#/components/schemas/ContentKind'
        versionId:
          $ref: '#/components/schemas/UUID'
        versionNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        availability:
          type: string
          enum:
            - PUBLISHED
            - STALE
        revisionId:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        access:
          $ref: '#/components/schemas/ContentAccess'
        document:
          anyOf:
            - $ref: '#/components/schemas/PublicDocument'
            - type: 'null'
        childResourceIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
      description: >-
        Métadonnées issues uniquement d’une révision publiée. FREE/PUBLISHED peut exposer PublicDocument ;
        PROTECTED ou STALE exige document:null. Aucune projection d’un brouillon, aucun fallback de langue,
        aucun droit payant déduit d’une session.
  headers:
    NoStore:
      description: Réponse non stockable ; les erreurs sont également privées.
      schema:
        type: string
        enum:
          - no-store
          - private, no-store
    ETag:
      description: >-
        ETag fort reçu du serveur. Préférences : preferences-{uuid}-r{revision} ; document CMS :
        content-{translationUuid}-r{revision}. Les représentations distinctes doivent invalider leur tag
        lorsque leurs octets changent.
      schema:
        type: string
        pattern: ^"[^"\\]*"$
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Reprendre l’ETag fort reçu, sans le reconstruire. Absent ou * seul : 428 ; révision dépassée ou tag
        faible : 412 ; syntaxe invalide : 400. Comparaison et écriture atomiques dans le service ; aucune
        répétition écrasante automatique.
      schema:
        type: string
        minLength: 1
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Jeton fourni par GET /auth/csrf pour cette session. Renouveler après login/logout ou expiration ;
        conserver en mémoire seulement.
      schema:
        type: string
        minLength: 1
  responses:
    ProblemResponse:
      description: Erreur explicite ; aucune donnée de remplacement.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceProblem:
      description: Service, base de données ou connexion au relais indisponible.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de session Spring opaque HttpOnly ; Secure en HTTPS, SameSite=Lax, Path=/.
