              - ACTIVITY
              - GUIDE
              - METHOD_TEMPLATE
        - name: goal
          in: query
          required: false
          schema:
            type: string
            enum:
              - understand-brief
              - define-scope
              - prepare-prompt
              - build-proposal
              - check-output
              - reuse-method
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum:
              - BEGINNER
              - INTERMEDIATE
              - ADVANCED
        - name: access
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentAccess'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - TITLE
              - RECENT
            default: TITLE
