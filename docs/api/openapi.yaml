            type: object
            additionalProperties: false
            required:
              - key
              - label
              - points
              - blocking
            properties:
              key:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^(fidelity|scope|budget|schedule|presentation)-[1-4]$
              label:
                type: string
                minLength: 1
                maxLength: 2000
              points:
                type: integer
                minimum: 1
                maximum: 1
              blocking:
                type: boolean
          minItems: 20
          maxItems: 20
      description: >-
        Préparation CMS lue depuis une ressource serveur protégée. Ni seed, sauvegarde, publication ni
        promesse commerciale ; libellésBR02 adaptés au brief.
    AssetView:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - scope
        - kind
        - state
        - filename
        - contentType
        - sizeBytes
        - locale
        - projectId
        - createdAt
        - readyAt
        - rejectionCode
        - validationStatus
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        revision:
          $ref: '#/components/schemas/Revision'
        scope:
          type: string
          enum:
            - PROJECT_FILE
            - EDITORIAL
        kind:
          type: string
          enum:
            - FILE
            - IMAGE
        state:
          type: string
          enum:
            - PENDING
            - READY
            - REJECTED
            - EXPIRED
        filename:
          type: string
          minLength: 1
          maxLength: 180
        contentType:
          type: string
          enum:
            - text/plain
            - application/pdf
            - image/png
            - image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520
        locale:
          anyOf:
            - $ref: '#/components/schemas/Locale'
            - type: 'null'
        projectId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/UtcInstant'
        readyAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        rejectionCode:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Z0-9_]+$
            - type: 'null'
        validationStatus:
          type: string
          enum:
            - PENDING
            - FORMAT_VERIFIED
            - REJECTED
      description: >-
        Fichier métier : identité, état et octets vérifiés côté serveur. Aucune clé objet, bucket ou propriété
        choisie par le navigateur. FORMAT_VERIFIED décrit un contrôle de format et ne prétend pas à un verdict
        antivirus. Scope et relations sont cohérents : projet privé ou ressource éditoriale localisée.
    AssetUploadRequest:
      type: object
      additionalProperties: false
      required:
        - filename
        - contentType
        - sizeBytes
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 180
        contentType:
          type: string
          enum:
            - text/plain
            - application/pdf
            - image/png
            - image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520
      description: >-
        Intent de transfert : nom sans chemin ni caractère de contrôle, taille et MIME comparés à la politique
        serveur. Les formats non disponibles sont refusés avant le transfert. La clé et le propriétaire sont
        fixés côté serveur.
    EditorialAssetUploadRequest:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - versionId
        - locale
        - filename
        - contentType
        - sizeBytes
      properties:
        resourceId:
          $ref: '#/components/schemas/UUID'
        versionId:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        filename:
          type: string
          minLength: 1
          maxLength: 180
        contentType:
          type: string
          enum:
            - text/plain
            - application/pdf
            - image/png
            - image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520
      description: >-
        Éditeur autorisé, identité/version/langue exactes. Une confirmation READY ne publie pas ce fichier et
        ne l’ajoute pas silencieusement au contenu.
    ConfirmProjectAsset:
      type: object
      additionalProperties: false
      required:
        - assetId
      properties:
        assetId:
          $ref: '#/components/schemas/UUID'
      description: >-
        Confirmer seulement un intent de ce projet ; le serveur relit et valide les octets réellement reçus.
        Aucune disponibilité fournie par le client.
    AssetUploadIntent:
      type: object
      additionalProperties: false
      required:
        - asset
        - method
        - uploadUrl
        - headers
        - expiresAt
      properties:
        asset:
          $ref: '#/components/schemas/AssetView'
        method:
          type: string
          enum:
            - PUT
        uploadUrl:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          $ref: '#/components/schemas/UtcInstant'
      description: >-
        URL externe temporaire et headers à utiliser pour le transfert direct sans cookie, redirect:error. Ni
        URL signée dans les journaux/stockages ni état READY après le seul PUT ; la confirmation est une
        commande distincte. Un ancien PUT ne peut modifier les octets READY validés.
    AssetAcceptedFormat:
      type: object
      additionalProperties: false
      required:
        - contentType
        - extensions
        - kind
        - maxBytes
        - available
        - unavailableReason
      properties:
        contentType:
          type: string
          enum:
            - text/plain
            - application/pdf
            - image/png
            - image/jpeg
        extensions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 12
            pattern: ^\.[a-z0-9]+$
          minItems: 1
          maxItems: 4
        kind:
          type: string
          enum:
            - FILE
            - IMAGE
        maxBytes:
          type: integer
          minimum: 1
          maximum: 20971520
        available:
          type: boolean
        unavailableReason:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Z0-9_]+$
            - type: 'null'
      description: >-
        Borne et disponibilité propres à ce format, affichées avant dépôt. TXT UTF-8 actif quand le stockage
        est configuré ; PDF indisponible sans validateur de document complexe.
    AssetUploadCapabilities:
      type: object
      additionalProperties: false
      required:
        - enabled
        - unavailableReason
        - formats
        - maxFileBytes
        - maxFilesPerProject
        - maxBytesPerProject
        - uploadTtlSeconds
        - downloadTtlSeconds
      properties:
        enabled:
          type: boolean
        unavailableReason:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Z0-9_]+$
            - type: 'null'
        formats:
          type: array
          items:
            $ref: '#/components/schemas/AssetAcceptedFormat'
          minItems: 1
          maxItems: 4
        maxFileBytes:
          type: integer
          minimum: 1
          maximum: 20971520
        maxFilesPerProject:
          type: integer
          minimum: 1
          maximum: 100
        maxBytesPerProject:
          type: integer
          minimum: 1
          maximum: 1073741824
        uploadTtlSeconds:
          type: integer
          minimum: 1
          maximum: 900
        downloadTtlSeconds:
          type: integer
          minimum: 1
          maximum: 300
      description: >-
        Politique serveur réelle. Stockage désactivé : enabled=false et raison explicite, jamais liste vide
        présentée comme absence de fichiers. Les quotas incluent PENDING non expirés et READY.
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetView'
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 0
          maximum: 1000000
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    AssetAccessContext:
      type: object
      additionalProperties: false
      required:
        - locale
        - resourceId
        - versionId
        - enrollmentId
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        resourceId:
          $ref: '#/components/schemas/UUID'
        versionId:
          $ref: '#/components/schemas/UUID'
        enrollmentId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
      description: >-
        Éditorial : publication exacte qui référence réellement ce fichier. Inscription facultative : chaîne
        pédagogique épinglée également vérifiée. Le body peut être null pour un fichier personnel, accessible
        uniquement à son propriétaire.
    AssetDownloadAccess:
      type: object
      additionalProperties: false
      required:
        - assetId
        - method
        - url
        - expiresAt
        - contentType
        - filename
        - disposition
        - sizeBytes
        - sha256
      properties:
        assetId:
          $ref: '#/components/schemas/UUID'
        method:
          type: string
          enum:
            - GET
        url:
          type: string
          format: uri
        expiresAt:
          $ref: '#/components/schemas/UtcInstant'
        contentType:
          type: string
          enum:
            - text/plain
            - application/pdf
            - image/png
            - image/jpeg
        filename:
          type: string
          minLength: 1
          maxLength: 180
        disposition:
          type: string
          enum:
            - attachment
            - inline
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 20971520
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          minLength: 64
          maxLength: 64
      description: >-
        Accès temporaire aux seuls octets READY vérifiés. Taille et SHA-256 proviennent du serveur. Le
        navigateur récupère sans cookie, contrôle MIME/taille/hash puis utilise un blobURL temporaire ; pas de
        href signé direct envoyant SESSION au port S3. Nouvelle délivrance refusée après perte d’accès ; un
        ancien lien garde sa validité résiduelle jusqu’au TTL.
    NotificationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - attempts
        - cycleAttempts
        - requeueCount
        - nextAttemptAt
        - leaseUntil
        - lastErrorCode
        - createdAt
        - updatedAt
        - expiresAt
        - sentAt
        - purgedAt
        - payloadAvailable
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        type:
          type: string
          enum:
            - PASSWORD_RESET
            - ACCOUNT_CREATED
            - ACCESS_ACTIVATED
            - SUPPORT_REPLY
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - RETRY
            - SENT
            - DEAD
            - INDETERMINATE
        attempts:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        cycleAttempts:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        requeueCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        nextAttemptAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        leaseUntil:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        lastErrorCode:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 40
              pattern: ^[A-Z0-9_]+$
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/UtcInstant'
        updatedAt:
          $ref: '#/components/schemas/UtcInstant'
        expiresAt:
          $ref: '#/components/schemas/UtcInstant'
        sentAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        purgedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        payloadAvailable:
          type: boolean
      description: >-
        Métadonnées opérationnelles seulement : aucune adresse, clé métier, empreinte, charge utile ou valeur
        chiffrée. L’état SENT suit un envoi déclaré par le transport, pas une promesse de livraison SMTP
        exactement une fois.
    NotificationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSummary'
          minItems: 0
          maxItems: 100
        page:
          type: integer
          minimum: 0
          maximum: 1000000
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    RetryNotification:
      type: object
      additionalProperties: false
      required:
        - reason
        - ackDuplicate
      properties:
        reason:
          type: string
          enum:
            - CONFIGURATION_FIXED
            - MANUAL_RECONCILIATION
        ackDuplicate:
          type: boolean
      description: >-
        Reprise explicite et auditée, sans destinataire ou contenu arbitraire. INDETERMINATE exige
        ackDuplicate=true ; un reset expiré ou un payload purgé est refusé. La reprise remet le compteur de
        cycle à zéro, conserve le total et ne signifie pas que le mail est livré.
    MediaAccessContext:
      type: object
      additionalProperties: false
      required:
        - locale
        - resourceId
        - versionId
        - enrollmentId
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        resourceId:
          $ref: '#/components/schemas/UUID'
        versionId:
          $ref: '#/components/schemas/UUID'
        enrollmentId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
      description: >-
        Publication exacte qui référence ce média VIDEO de cette langue ; inscription facultative ajoute la
        chaîne pédagogique épinglée. Aucun chemin ou URL de fichier reçu du navigateur.
    VideoMediaView:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - provider
        - durationSeconds
        - sizeBytes
        - sha256
        - playbackAvailable
        - unavailableReason
        - transcript
        - captionsVtt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        provider:
          type: string
          enum:
            - LOCAL_TEST
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 134217728
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          minLength: 64
          maxLength: 64
        playbackAvailable:
          type: boolean
        unavailableReason:
          anyOf:
            - type: string
              enum:
                - PROVIDER_NOT_CONFIGURED
                - MEDIA_UNAVAILABLE
            - type: 'null'
        transcript:
          anyOf:
            - type: string
              maxLength: 8000
            - type: 'null'
        captionsVtt:
          anyOf:
            - type: string
              maxLength: 8000
            - type: 'null'
      description: >-
        Métadonnées de MP4 réellement importé, durée lue dans le conteneur et octets hachés. Provider
        local/test seulement, désactivé par défaut. Média absent : 404, sans durée inventée ; provider
        désactivé/fichier indisponible : état honnête et alternative textuelle de la leçon. Aucun film de
        cours produit ou fournisseur de production déduit.
    VideoPlaybackAccess:
      type: object
      additionalProperties: false
      required:
        - mediaId
        - provider
        - url
        - expiresAt
        - contentType
        - durationSeconds
        - sizeBytes
        - sha256
      properties:
        mediaId:
          $ref: '#/components/schemas/UUID'
        provider:
          type: string
          enum:
            - LOCAL_TEST
        url:
          type: string
          pattern: ^/api/v1/media/[0-9a-fA-F-]{36}/stream\?grant=[A-Za-z0-9_-]{43}$
        expiresAt:
          $ref: '#/components/schemas/UtcInstant'
        contentType:
          type: string
          enum:
            - video/mp4
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 134217728
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          minLength: 64
          maxLength: 64
      description: >-
        Lien bearer opaque de même origine, 60 secondes au plus ; seul son hash est stocké. Ne pas journaliser
        ou conserver son URL. Chaque nouvelle délivrance réautorise publication/langue/chaîne ; le lien
        existant reste utilisable jusqu’au TTL. La lecture ne valide aucun projet ni activité.
    MediaProgressView:
      type: object
      additionalProperties: false
      required:
        - mediaId
        - locale
        - durationSeconds
        - positionSeconds
        - revision
        - updatedAt
      properties:
        mediaId:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
        positionSeconds:
          type: number
          minimum: 0
          maximum: 86400
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
      description: >-
        Position du propriétaire par mediaId, bornée par sa durée mesurée ; aucun déplacement entre vidéos
        FR/EN. Révision0/updatedAt:null signifie aucune sauvegarde persistée, pas une confirmation de lecture.
        ETag propre au média, sans contexte de publication variable dans sa représentation.
    SetMediaProgress:
      type: object
      additionalProperties: false
      required:
        - context
        - positionSeconds
      properties:
        context:
          $ref: '#/components/schemas/MediaAccessContext'
        positionSeconds:
          type: number
          minimum: 0
          maximum: 86400
      description: >-
        Seule la position est fournie ; durée, propriétaire et révision restent serveur. If-Match atomique :
        absence428, conflit412. Une position identique sauvegardée conserve le tag ; aucune réussite de
        quiz/projet ou durée regardée n’est déduite.
  headers:
    NoStore:
      description: Réponse non stockable ; les erreurs sont également privées.
      schema:
        type: string
        enum:
          - no-store
          - private, no-store
    ETag:
      description: >-
        ETag fort reçu du serveur. Préférences : preferences-{uuid}-r{revision} ; document CMS :
        content-{translationUuid}-r{revision}. Les représentations distinctes doivent invalider leur tag
        lorsque leurs octets changent.
      schema:
        type: string
        pattern: ^"[^"\\]*"$
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Reprendre l’ETag fort reçu, sans le reconstruire. Absent ou * seul : 428 ; révision dépassée ou tag
        faible : 412 ; syntaxe invalide : 400. Comparaison et écriture atomiques dans le service ; aucune
        répétition écrasante automatique.
      schema:
        type: string
        minLength: 1
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Jeton fourni par GET /auth/csrf pour cette session. Renouveler après login/logout ou expiration ;
        conserver en mémoire seulement.
      schema:
        type: string
        minLength: 1
    AccountContext:
      name: X-Account-Context
      in: header
      required: true
      description: >-
        UUID du compte que l’interface attend lors de cette action explicite. Comparé à la session côté
        serveur, jamais utilisé comme propriétaire. Absent428 ACCOUNT_CONTEXT_REQUIRED ; compte différent409
        ACCOUNT_CONTEXT_CHANGED ; syntaxe invalide400 VALIDATION_FAILED. Renouveler le contexte après
        changement de compte ; aucun import automatique du brouillon précédent.
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    ProblemResponse:
      description: Erreur explicite ; aucune donnée de remplacement.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceProblem:
      description: Service, base de données ou connexion au relais indisponible.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de session Spring opaque HttpOnly ; Secure en HTTPS, SameSite=Lax, Path=/.
