openapi: 3.1.1
info:
  title: ChatGPT Courses API
  version: 0.1.0
  description: >-
    Contrat des opérations jusqu’à P10 : identité, CMS, catalogue, méthodes, apprentissage, quiz, projets,
    fichiers contrôlés et outbox durable. Les preuves distinguent validation locale et fournisseur externe ;
    aucun paiement ou droit commercial fictif ni revue humaine.
servers:
  - url: /api/v1
    description: API de même origine, préfixe conservé jusqu'à Spring.
security: []
tags:
  - name: System
    description: Disponibilité technique, sans données privées ou configuration interne.
  - name: Identity
    description: Compte, session, récupération et préférences du propriétaire.
  - name: Editorial
    description: Contenus, versions, traductions et publication ; permissions distinctes du commerce.
  - name: Catalogue
    description: Publications publiques, métadonnées éditoriales et programmes aux versions épinglées.
  - name: Methods
    description: Générateur déterministe et instantanés personnels propriétaires, sans API IA.
  - name: Learning
    description: Faits d’apprentissage distincts, notes propriétaires et quiz corrigés côté serveur.
  - name: Projects
    description: Productions personnelles, autoévaluation déclarative et consultation de corrigé réautorisée.
  - name: Assets
    description: 'Fichiers privés et ressources éditoriales : intent, transfert, contrôle réel et accès temporaire.'
  - name: Notifications
    description: Outbox durable chiffrée et opérations de reprise autorisées.
  - name: Media
    description: >-
      Provider vidéo local de test et positions propres au média ; intégration streaming de production
      distincte.
paths:
  /system/health:
    get:
      operationId: getSystemHealth
      tags:
        - System
      summary: Vérifier la connexion réelle à PostgreSQL.
      description: >-
        Public, sans création de session anonyme. UP est renvoyé seulement après une requête SELECT 1 réussie.
        Une panne de base produit 503 ; une panne ou un délai dépassé du relais de même origine produit 502 ou
        504.
      responses:
        '200':
          description: PostgreSQL répond à la requête de disponibilité.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '502':
          $ref: '#/components/responses/ServiceProblem'
        '503':
          $ref: '#/components/responses/ServiceProblem'
        '504':
          $ref: '#/components/responses/ServiceProblem'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
        - Identity
      summary: Obtenir le jeton CSRF Spring de la session.
      security: []
      responses:
        '200':
          description: Jeton Spring non mis en cache ; peut créer une session anonyme.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/register:
    post:
      operationId: register
      tags:
        - Identity
      summary: Créer un compte apprenant sans connexion automatique.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé ; continuer par le login Spring normal.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/login:
    post:
      operationId: login
      tags:
        - Identity
      summary: Ouvrir une session par les filtres Spring Security.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification confirmée, session tournée et contexte persisté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Identity
      summary: Invalider réellement la session courante.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidée et cookie expiré. Recharger un jeton CSRF avant une nouvelle mutation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Identity
      summary: Lire le compte et les permissions courantes côté serveur.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Compte actif de la session ; aucune empreinte ni clé de session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      tags:
        - Identity
      summary: Demander une récupération avec réponse neutre.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Demande reçue, sans révéler si un compte existe.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/password-resets:
    post:
      operationId: resetPassword
      tags:
        - Identity
      summary: Consommer une seule fois un jeton de récupération.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Mot de passe remplacé et sessions existantes révoquées.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /me/preferences:
    get:
      operationId: getPreferences
      tags:
        - Identity
      summary: Lire les préférences du propriétaire de la session.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Préférences et ETag fort.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      operationId: updatePreferences
      tags:
        - Identity
      summary: Modifier la langue du compte avec contrôle de révision.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPatch'
      responses:
        '200':
          description: Modification persistée et nouvelle révision.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/contents:
    get:
      operationId: listContents
      tags:
        - Editorial
      summary: Chercher les contenus administratifs avec pagination.
      security:
        - SessionCookie: []
      description: Permission content.read. Les filtres ne changent jamais l’autorisation serveur.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 240
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentKind'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EditorialState'
        - name: locale
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Locale'
        - name: courseId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UUID'
        - name: verifiedBefore
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UtcInstant'
        - name: needsUpdate
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
          description: Page 0-based ; défaut 0.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Taille de page ; défaut 20.
      responses:
        '200':
          description: Représentation persistée courante.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      operationId: createContent
      tags:
        - Editorial
      summary: Créer une identité et un brouillon éditorial.
      security:
        - SessionCookie: []
      description: Permission content.write ; acteur fourni par la session, jamais par le corps.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContent'
      responses:
        '201':
          description: Document créé, brouillon sans publication.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
                format: uri-reference
              description: Document CMS créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/contents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID du document CMS (traduction et version), distinct de resourceId.
    get:
      operationId: getContent
      tags:
        - Editorial
      summary: Lire le document CMS courant.
      security:
        - SessionCookie: []
      description: Permission content.read ; représentation privée complète.
      responses:
        '200':
          description: Représentation persistée courante.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/contents/{id}/revisions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID du document CMS (traduction et version), distinct de resourceId.
    post:
      operationId: saveContentRevision
      tags:
        - Editorial
      summary: Enregistrer une nouvelle révision éditoriale.
      security:
        - SessionCookie: []
      description: Permission content.write. CSRF et If-Match obligatoires ; aucune mutation automatique après conflit.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRevision'
      responses:
        '200':
          description: Représentation persistée courante.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    get:
      operationId: listContentRevisions
      tags:
        - Editorial
      summary: Lire les instantanés historiques paginés.
      security:
        - SessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
          description: Page 0-based ; défaut 0.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Taille de page ; défaut 20.
      description: Permission content.read ; aucun historique privé dans le catalogue public.
      responses:
        '200':
          description: Représentation persistée courante.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionPage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/contents/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID du document CMS (traduction et version), distinct de resourceId.
    post:
      operationId: createContentVersion
      tags:
        - Editorial
      summary: Créer une nouvelle version pédagogique.
      security:
        - SessionCookie: []
      description: Permission content.write. CSRF et If-Match obligatoires ; aucune mutation automatique après conflit.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVersion'
      responses:
        '201':
          description: Document créé, brouillon sans publication.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
                format: uri-reference
              description: Document CMS créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/contents/{id}/duplicate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID du document CMS (traduction et version), distinct de resourceId.
    post:
      operationId: duplicateContent
      tags:
        - Editorial
      summary: Dupliquer vers une nouvelle identité en brouillon.
      security:
        - SessionCookie: []
      description: Permission content.write. CSRF et If-Match obligatoires ; aucune mutation automatique après conflit.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateContent'
      responses:
        '201':
          description: Document créé, brouillon sans publication.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
                format: uri-reference
              description: Document CMS créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/contents/{id}/translations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID du document CMS (traduction et version), distinct de resourceId.
    post:
      operationId: createContentTranslation
      tags:
        - Editorial
      summary: Créer explicitement une traduction sur la même version.
      security:
        - SessionCookie: []
      description: Permission content.write. CSRF et If-Match obligatoires ; aucune mutation automatique après conflit.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranslation'
      responses:
        '201':
          description: Document créé, brouillon sans publication.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
                format: uri-reference
              description: Document CMS créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /admin/contents/{id}/transition:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID du document CMS (traduction et version), distinct de resourceId.
    post:
      operationId: transitionContent
      tags:
        - Editorial
      summary: Soumettre, vérifier ou signaler une actualisation.
      security:
        - SessionCookie: []
      description: >-
        Permission content.review pour READY, content.write pour TO_REVIEW/STALE. CSRF et If-Match
        obligatoires ; aucune mutation automatique après conflit.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionContent'
      responses:
        '200':
          description: Représentation persistée courante.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
              description: Représentation administrative non indexable.
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
