    get:
      operationId: getVideoStream
      tags:
        - Media
      summary: Lire les octets MP4 avec un grant court et une plage unique.
      security: []
      description: >-
        Bearer de lecture temporaire, pas une session d’authentification. Grant opaque validé par
        hash/expiration et mediaId, jamais journalisé. Une requête débutée avant expiration peut finir son
        flux ; nouvelle requête après expiration refusée. Accepte une plage bytes unique, sans chemin client
        ni URL distante.
      parameters:
        - name: grant
          in: query
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Plage unique bytes=start-end, bytes=start- ou bytes=-suffix.
      responses:
        '200':
          description: Flux complet vérifié.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Plage de flux partielle.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '416':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    head:
      operationId: headVideoStream
      tags:
        - Media
      summary: Lire les headers du flux sans corps vidéo.
      security: []
      parameters:
        - name: grant
          in: query
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Headers du média.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            Content-Range:
              schema:
                type: string
        '206':
          description: Headers de la plage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              schema:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            Content-Range:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '416':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /me/media-progress/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      operationId: getMediaProgress
      tags:
        - Media
      summary: Lire sa position propre au média, sans inventer de sauvegarde.
      security:
        - SessionCookie: []
      description: >-
        Permission media.progress.read et contexte pédagogique actuel autorisé. Un GET initial ne crée aucune
        ligne.
      parameters:
        - name: resourceId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: versionId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: locale
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Locale'
        - name: enrollmentId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: État réel, sans cache partagé.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaProgressView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      operationId: setMediaProgress
      tags:
        - Media
      summary: Conserver une position bornée sous révision et compte attendus.
      security:
        - SessionCookie: []
      description: >-
        Permission media.progress.write, CSRF, X-Account-Context, If-Match et contrôle serveur de la durée.
        Propriétaire de session, médias/langues distincts, aucune validation pédagogique déduite.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/AccountContext'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMediaProgress'
      responses:
        '200':
          description: État réel, sans cache partagé.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaProgressView'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: UP
    UUID:
      type: string
      format: uuid
      description: Identifiant technique ; ne constitue jamais une autorisation.
    Locale:
      type: string
      enum:
        - fr
        - en
      description: Langue explicite, indépendante de l'identité pédagogique.
    UtcInstant:
      type: string
      format: date-time
      pattern: Z$
      description: Instant ISO 8601 en UTC, avec suffixe Z.
    Revision:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Révision optimiste exacte dans les entiers sûrs JavaScript.
    Money:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - currency
      description: >-
        Montant exact en unités mineures et devise explicite. Ce schéma ne définit aucun prix ni aucune devise
        commerciale autorisée.
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Code de devise ISO 4217 ; configuration de vente requise.
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          description: Chemin du champ concerné, sans valeur rejetée.
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Code stable permettant la traduction du message.
        message:
          type: string
          minLength: 1
          description: Message sûr ; jamais une valeur privée ou une exception brute.
    Problem:
      type: object
      description: >-
        RFC 9457. Les codes stables pilotent les traductions. Ni trace technique, secret, valeur de champ
        rejetée ou donnée privée dans les messages. fieldErrors n'est présent que lorsqu'une validation le
        nécessite.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri
          const: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
          description: Chemin de requête, sans paramètres privés.
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: >-
            Notamment RESOURCE_NOT_FOUND, SERVICE_UNAVAILABLE, INTERNAL_ERROR, API_UNAVAILABLE,
            API_CONFIGURATION_ERROR, API_INVALID_RESPONSE, INVALID_API_PATH, INVALID_REQUEST,
            VALIDATION_FAILED, INVALID_IF_MATCH, CONFLICT, REVISION_CONFLICT, PRECONDITION_REQUIRED. Cette
            liste reste ouverte aux erreurs des lots suivants.
        traceId:
          $ref: '#/components/schemas/UUID'
        fieldErrors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldError'
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - locale
        - roles
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
        locale:
          $ref: '#/components/schemas/Locale'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - token
        - headerName
        - parameterName
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
        parameterName:
          type: string
          const: _csrf
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - locale
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12 à 128 points Unicode, au plus 1024 octets UTF-8. Aucun retrait ou troncature du mot de passe.
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
        locale:
          $ref: '#/components/schemas/Locale'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - locale
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        locale:
          $ref: '#/components/schemas/Locale'
    PasswordReset:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Jeton opaque reçu par email, jamais dans une query string.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12 à 128 points Unicode, au plus 1024 octets UTF-8. Aucun retrait ou troncature du mot de passe.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - revision
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        revision:
          $ref: '#/components/schemas/Revision'
    PreferencesPatch:
      type: object
      additionalProperties: false
      required:
        - locale
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
    ContentKind:
      type: string
      enum:
        - COURSE
        - MODULE
        - ACTIVITY
        - GUIDE
        - METHOD_TEMPLATE
    EditorialState:
      type: string
      enum:
        - DRAFT
        - TO_REVIEW
        - READY
        - PUBLISHED
        - STALE
        - ARCHIVED
    ContentAccess:
      type: string
      enum:
        - FREE
        - PROTECTED
    ContentBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - text
        - url
      properties:
        type:
          type: string
          enum:
            - HEADING
            - PARAGRAPH
            - LIST
            - CALLOUT
            - CODE
            - LINK
        text:
          type: string
          minLength: 1
          maxLength: 4000
        url:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: 'null'
      description: >-
        Texte brut, jamais HTML/MDX. LINK exige une URL HTTPS sans credentials ou un chemin interne simple ;
        les autres types exigent url:null. Pas de téléchargement serveur depuis cette URL.
    Exercise:
      type: object
      additionalProperties: false
      required:
        - instructions
        - correction
      properties:
        instructions:
          type: string
          minLength: 0
          maxLength: 8000
        correction:
          type: string
          minLength: 0
          maxLength: 8000
    QuizQuestion:
      type: object
      additionalProperties: false
      required:
        - key
        - prompt
        - options
        - correctOption
        - explanation
        - points
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        options:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          minItems: 2
          maxItems: 8
        correctOption:
          type: integer
          minimum: 0
          maximum: 7
        explanation:
          type: string
          minLength: 1
          maxLength: 4000
        points:
          type: integer
          minimum: 1
          maximum: 1000
      description: >-
        correctOption est un index 0-based strictement inférieur au nombre d’options ; clé unique dans le
        document. Réponses réservées aux routes administratives.
    RubricCriterion:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - points
        - blocking
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        label:
          type: string
          minLength: 1
          maxLength: 2000
        points:
          type: integer
          minimum: 1
          maximum: 1000
        blocking:
          type: boolean
    MediaReference:
      type: object
      additionalProperties: false
      required:
        - assetId
        - kind
        - required
        - label
      properties:
        assetId:
          $ref: '#/components/schemas/UUID'
        kind:
          type: string
          enum:
            - IMAGE
            - VIDEO
            - FILE
        required:
          type: boolean
        label:
          type: string
          minLength: 1
          maxLength: 240
      description: >-
        Aucun état de disponibilité choisi par le client. Les références sont non vérifiées en P05 ; required
        bloque tant que le registre serveur P10 ne les valide pas.
    ContentDocument:
      type: object
      additionalProperties: false
      required:
        - objective
        - expectedResult
        - prerequisites
        - blocks
        - estimatedMinutes
        - exercise
        - quiz
        - rubric
        - access
        - media
        - relatedResourceIds
      properties:
        objective:
          type: string
          minLength: 0
          maxLength: 4000
        expectedResult:
          type: string
          minLength: 0
          maxLength: 4000
        prerequisites:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          minItems: 0
          maxItems: 20
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
          minItems: 0
          maxItems: 60
        estimatedMinutes:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 1440
            - type: 'null'
        exercise:
          anyOf:
            - $ref: '#/components/schemas/Exercise'
            - type: 'null'
        quiz:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
          minItems: 0
          maxItems: 20
        rubric:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriterion'
          minItems: 0
          maxItems: 30
        access:
          $ref: '#/components/schemas/ContentAccess'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaReference'
          minItems: 0
          maxItems: 20
        relatedResourceIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 30
          uniqueItems: true
        methodDefinition:
          anyOf:
            - $ref: '#/components/schemas/MethodDefinition'
            - type: 'null'
        quizPolicy:
          anyOf:
            - $ref: '#/components/schemas/QuizPolicy'
            - type: 'null'
        projectPolicy:
          anyOf:
            - $ref: '#/components/schemas/ProjectPolicy'
            - type: 'null'
      description: >-
        Document structuré privé ; taille sérialisée totale maximale 48 KiB UTF-8. La requête entière reste
        limitée à 64 KiB par le relais. Listes bornées et références contrôlées dans le service.
        methodDefinition est optionnel en entrée pour préserver les documents P05/P06 ; absent signifie null,
        sans reconstruction depuis les blocs.
    CreateContent:
      type: object
      additionalProperties: false
      required:
        - kind
        - locale
        - slug
        - title
        - summary
        - objectives
        - evaluationDefinition
        - document
        - childVersionIds
        - reason
      properties:
        kind:
          $ref: '#/components/schemas/ContentKind'
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        objectives:
          type: string
          minLength: 1
          maxLength: 4000
        evaluationDefinition:
          type: string
          minLength: 1
          maxLength: 4000
        document:
          $ref: '#/components/schemas/ContentDocument'
        childVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    SaveRevision:
      type: object
      additionalProperties: false
      required:
        - title
        - summary
        - document
        - reason
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        document:
          $ref: '#/components/schemas/ContentDocument'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      description: >-
        Ajoute un instantané éditorial sans changer la version pédagogique. Objectif ou barème changé après
        gel : nouvelle version exigée (409 NEW_PEDAGOGICAL_VERSION_REQUIRED).
    NewVersion:
      type: object
      additionalProperties: false
      required:
        - objectives
        - evaluationDefinition
        - title
        - summary
        - document
        - childVersionIds
        - reason
      properties:
        objectives:
          type: string
          minLength: 1
          maxLength: 4000
        evaluationDefinition:
          type: string
          minLength: 1
          maxLength: 4000
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        document:
          $ref: '#/components/schemas/ContentDocument'
        childVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    DuplicateContent:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - reason
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 240
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    CreateTranslation:
      type: object
      additionalProperties: false
      required:
        - locale
        - slug
        - title
        - summary
        - document
        - reason
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 240
        summary:
          type: string
          minLength: 0
          maxLength: 2000
        document:
          $ref: '#/components/schemas/ContentDocument'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    TransitionContent:
      type: object
      additionalProperties: false
      required:
        - state
        - reason
      properties:
        state:
          type: string
          enum:
            - TO_REVIEW
            - READY
            - STALE
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        sourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
      description: >-
        READY exige content.review et readiness sans bloqueur ; TO_REVIEW/STALE exigent content.write. Pour la
        revue d’une traduction liée, sourceRevisionId doit correspondre à la révision source courante.
    PublishContent:
      type: object
      additionalProperties: false
      required:
        - revisionId
        - reason
      properties:
        revisionId:
          $ref: '#/components/schemas/UUID'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      description: >-
        Publie la révision courante déterminée ; readiness, revue, permission et If-Match revérifiés dans la
        transaction.
    ArchiveContent:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ReplaceComposition:
      type: object
      additionalProperties: false
      required:
        - childVersionIds
        - reason
      properties:
        childVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      description: >-
        Ordre complet des UUID versions enfants, position serveur 1-based. Modification réservée à une
        pédagogie non gelée.
    TranslationLink:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - state
        - sourceRevisionId
        - reviewedSourceRevisionId
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        state:
          $ref: '#/components/schemas/EditorialState'
        sourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        reviewedSourceRevisionId:
          anyOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
    ContentView:
      type: object
      additionalProperties: false
      required:
        - id
        - resourceId
        - kind
        - versionId
        - versionNumber
        - locale
        - slug
        - state
        - revision
        - currentRevisionId
        - publishedRevisionId
        - title
        - summary
        - objectives
        - evaluationDefinition
        - document
        - childVersionIds
        - sourceTranslationId
        - sourceRevisionId
        - reviewedSourceRevisionId
        - verifiedAt
        - updatedAt
        - frozenAt
        - translations
        - legacyBody
        - metadata
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        resourceId:
          $ref: '#/components/schemas/UUID'
        kind:
          $ref: '#/components/schemas/ContentKind'
        versionId:
          $ref: '#/components/schemas/UUID'
        versionNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        locale:
          $ref: '#/components/schemas/Locale'
        slug:
          type: string
          minLength: 1
          maxLength: 180
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        state:
          $ref: '#/components/schemas/EditorialState'
