openapi: 3.1.1
info:
  title: ChatGPT Courses API
  version: 0.1.0
  description: >-
    Opérations réellement introduites jusqu’à P04. Identité Spring, CSRF et sessions JDBC ; aucune route
    future ne répond un faux succès.
servers:
  - url: /api/v1
    description: API de même origine, préfixe conservé jusqu'à Spring.
security: []
tags:
  - name: System
    description: Disponibilité technique, sans données privées ou configuration interne.
  - name: Identity
    description: Compte, session, récupération et préférences du propriétaire.
paths:
  /system/health:
    get:
      operationId: getSystemHealth
      tags:
        - System
      summary: Vérifier la connexion réelle à PostgreSQL.
      description: >-
        Public, sans création de session anonyme. UP est renvoyé seulement après une requête SELECT 1 réussie.
        Une panne de base produit 503 ; une panne ou un délai dépassé du relais de même origine produit 502 ou
        504.
      responses:
        '200':
          description: PostgreSQL répond à la requête de disponibilité.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '502':
          $ref: '#/components/responses/ServiceProblem'
        '503':
          $ref: '#/components/responses/ServiceProblem'
        '504':
          $ref: '#/components/responses/ServiceProblem'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
        - Identity
      summary: Obtenir le jeton CSRF Spring de la session.
      security: []
      responses:
        '200':
          description: Jeton Spring non mis en cache ; peut créer une session anonyme.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/register:
    post:
      operationId: register
      tags:
        - Identity
      summary: Créer un compte apprenant sans connexion automatique.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé ; continuer par le login Spring normal.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/login:
    post:
      operationId: login
      tags:
        - Identity
      summary: Ouvrir une session par les filtres Spring Security.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification confirmée, session tournée et contexte persisté.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Identity
      summary: Invalider réellement la session courante.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidée et cookie expiré. Recharger un jeton CSRF avant une nouvelle mutation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Identity
      summary: Lire le compte et les permissions courantes côté serveur.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Compte actif de la session ; aucune empreinte ni clé de session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      tags:
        - Identity
      summary: Demander une récupération avec réponse neutre.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Demande reçue, sans révéler si un compte existe.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /auth/password-resets:
    post:
      operationId: resetPassword
      tags:
        - Identity
      summary: Consommer une seule fois un jeton de récupération.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Mot de passe remplacé et sessions existantes révoquées.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /me/preferences:
    get:
      operationId: getPreferences
      tags:
        - Identity
      summary: Lire les préférences du propriétaire de la session.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Préférences et ETag fort.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      operationId: updatePreferences
      tags:
        - Identity
      summary: Modifier la langue du compte avec contrôle de révision.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPatch'
      responses:
        '200':
          description: Modification persistée et nouvelle révision.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '412':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: UP
    UUID:
      type: string
      format: uuid
      description: Identifiant technique ; ne constitue jamais une autorisation.
    Locale:
      type: string
      enum:
        - fr
        - en
      description: Langue explicite, indépendante de l'identité pédagogique.
    UtcInstant:
      type: string
      format: date-time
      pattern: Z$
      description: Instant ISO 8601 en UTC, avec suffixe Z.
    Revision:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Révision optimiste exacte dans les entiers sûrs JavaScript.
    Money:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - currency
      description: >-
        Montant exact en unités mineures et devise explicite. Ce schéma ne définit aucun prix ni aucune devise
        commerciale autorisée.
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Code de devise ISO 4217 ; configuration de vente requise.
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          description: Chemin du champ concerné, sans valeur rejetée.
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Code stable permettant la traduction du message.
        message:
          type: string
          minLength: 1
          description: Message sûr ; jamais une valeur privée ou une exception brute.
    Problem:
      type: object
      description: >-
        RFC 9457. Les codes stables pilotent les traductions. Ni trace technique, secret, valeur de champ
        rejetée ou donnée privée dans les messages. fieldErrors n'est présent que lorsqu'une validation le
        nécessite.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri
          const: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
          description: Chemin de requête, sans paramètres privés.
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: >-
            Notamment RESOURCE_NOT_FOUND, SERVICE_UNAVAILABLE, INTERNAL_ERROR, API_UNAVAILABLE,
            API_CONFIGURATION_ERROR, API_INVALID_RESPONSE, INVALID_API_PATH, INVALID_REQUEST,
            VALIDATION_FAILED, INVALID_IF_MATCH, CONFLICT, REVISION_CONFLICT, PRECONDITION_REQUIRED. Cette
            liste reste ouverte aux erreurs des lots suivants.
        traceId:
          $ref: '#/components/schemas/UUID'
        fieldErrors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldError'
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - locale
        - roles
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
        locale:
          $ref: '#/components/schemas/Locale'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - token
        - headerName
        - parameterName
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          const: X-CSRF-TOKEN
        parameterName:
          type: string
          const: _csrf
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - locale
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12 à 128 points Unicode, au plus 1024 octets UTF-8. Aucun retrait ou troncature du mot de passe.
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
        locale:
          $ref: '#/components/schemas/Locale'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - locale
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        locale:
          $ref: '#/components/schemas/Locale'
    PasswordReset:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Jeton opaque reçu par email, jamais dans une query string.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12 à 128 points Unicode, au plus 1024 octets UTF-8. Aucun retrait ou troncature du mot de passe.
    Preferences:
      type: object
      additionalProperties: false
      required:
        - id
        - locale
        - revision
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        locale:
          $ref: '#/components/schemas/Locale'
        revision:
          $ref: '#/components/schemas/Revision'
    PreferencesPatch:
      type: object
      additionalProperties: false
      required:
        - locale
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
  headers:
    NoStore:
      description: Réponse non stockable ; les erreurs sont également privées.
      schema:
        type: string
        enum:
          - no-store
          - private, no-store
    ETag:
      description: >-
        Convention préparée : ETag fort reçu du serveur pour une ressource modifiable. Aucune mutation
        correspondante n'est disponible en P03.
      schema:
        type: string
        pattern: ^"[^"\\]*"$
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Convention préparée pour les futures mutations : reprendre l'ETag fort reçu, sans le reconstruire.
        Absent ou * seul : 428 ; révision dépassée ou tag faible : 412 ; syntaxe invalide : 400. La
        comparaison et l'écriture doivent être atomiques. Aucun endpoint factice n'est ajouté en P03.
      schema:
        type: string
        minLength: 1
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        Jeton fourni par GET /auth/csrf pour cette session. Renouveler après login/logout ou expiration ;
        conserver en mémoire seulement.
      schema:
        type: string
        minLength: 1
  responses:
    ProblemResponse:
      description: Erreur explicite ; aucune donnée de remplacement.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceProblem:
      description: Service, base de données ou connexion au relais indisponible.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de session Spring opaque HttpOnly ; Secure en HTTPS, SameSite=Lax, Path=/.
